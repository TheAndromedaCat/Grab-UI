<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab UI</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 1200px; margin-top: 30px; margin-bottom: 50px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: #e0e0e0; margin-bottom: 20px; }
        .form-control, .form-select { background-color: #2d2d2d; border: 1px solid #444; color: #fff; }
        .form-control::placeholder { color: #888; opacity: 1; }
        .loading-text { color: #888; font-size: 0.85em; }
        .terminal-wrapper { background-color: #000; border: 2px solid #444; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; height: 400px; overflow: hidden; position: relative; }
        .terminal-scroll-area { flex: 1; overflow: auto; background-color: #000; display: block; -webkit-overflow-scrolling: touch; }
        .terminal-container { padding: 15px; min-width: 800px; width: 100%; height: 100%; }
        .terminal-footer { background-color: #1a1a1a; border-top: 2px solid #444; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; min-height: 45px; flex-shrink: 0; }
        .fb-prompt-floating { position: absolute; top: 10px; right: 15px; z-index: 100; background: rgba(30, 30, 30, 0.9); padding: 5px 12px; border: 1px solid #444; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none !important; align-items: center; gap: 10px; border-top: 2px solid #8be9fd; }
        .fb-dropdown { background-color: #2d2d2d; border: 1px solid #444; color: #8be9fd; font-size: 0.85em; padding: 2px 8px; border-radius: 4px; max-width: 300px; }
        .scroll-to-bottom { color: #8be9fd; text-decoration: none; font-size: 0.85em; font-weight: bold; }
        .terminal-scroll-area::-webkit-scrollbar, .xterm-viewport::-webkit-scrollbar { width: 12px; height: 12px; }
        .terminal-scroll-area::-webkit-scrollbar-track, .xterm-viewport::-webkit-scrollbar-track { background: #000; }
        .terminal-scroll-area::-webkit-scrollbar-thumb, .xterm-viewport::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; border: 2px solid #000; }
        .tree-container { background-color: #1e1e1e; border: 1px solid #333; border-radius: 5px; padding: 15px; height: 350px; overflow-y: auto; width: 100%; }
        .tree-title { font-size: 1.1em; font-weight: bold; color: #8be9fd; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .tree-list { list-style: none; padding-left: 20px; margin: 0; }
        .tree-item { cursor: pointer; margin: 2px 0; user-select: none; white-space: nowrap; }
        .folder::before { content: '📁 '; } .folder.open::before { content: '📂 '; } .file::before { content: '📄 '; }
        .nested { display: none; } .active { display: block; }
        .footer-links { display: flex; justify-content: space-between; margin-top: 20px; opacity: 0.5; } .footer-links a { color: #888; text-decoration: none; font-size: 0.8em; }
        .modal-content { background-color: #1e1e1e; color: #e0e0e0; border: 1px solid #444; } .modal-header { border-bottom: 1px solid #333; } .modal-footer { border-top: 1px solid #333; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a2a; } .detail-label { color: #888; font-weight: bold; } .detail-value { color: #fff; }
        .icon-btn { cursor: pointer; padding: 4px; border-radius: 4px; transition: background 0.2s; vertical-align: middle; margin-left: 8px; border: 1px solid transparent; background: none; }
        .icon-btn:hover { background: #333; border-color: #444; }
        .icon-btn svg { width: 18px; height: 18px; fill: #8be9fd; }
        .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .slot-card { border-left: 4px solid #444; }
        .slot-card.running { border-left-color: #50fa7b; }
    </style>
</head>
<body>
<svg style="display: none;">
    <symbol id="icon-copy" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></symbol>
</svg>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Grab UI <span class="badge bg-secondary" id="status" style="font-size: 0.5em;">Disconnected</span></h2>
        <div class="d-flex gap-2">
            <div class="input-group input-group-sm" style="width: 250px;">
                <span class="input-group-text">Local Path Root</span>
                <input type="text" id="local-path-root" class="form-control" placeholder="e.g. P:">
                <button class="btn btn-outline-secondary" type="button" id="save-settings-btn">Save</button>
            </div>
            <button id="add-session-btn" class="btn btn-outline-info btn-sm">Add Session (Max 3)</button>
        </div>
    </div>

    <div id="slots-container"></div>

    <div class="row">
        <div class="col-12 mb-3">
            <div class="tree-container">
                <div class="tree-title">__STAGING__</div>
                <div id="staging-tree">
                    <div class="d-flex align-items-center p-2 loading-text">
                        <div class="spinner-border spinner-border-sm text-info me-2"></div>
                        Scanning staging...
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <div class="tree-container">
                <div class="tree-title">__OUTPUTS__</div>
                <div id="outputs-tree">
                    <div class="d-flex align-items-center p-2 loading-text">
                        <div class="spinner-border spinner-border-sm text-info me-2"></div>
                        Scanning outputs...
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer-links"><a href="/logout">Sign Out</a><a href="/admin.html">Admin Panel</a></div>
</div>

<div class="modal fade" id="detailsModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="detailsTitle">File Details</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body" id="detailsBody"></div></div></div></div>

<script>
    const socket = io();
    const slotsContainer = document.getElementById('slots-container');
    const addSessionBtn = document.getElementById('add-session-btn');
    const detailsModal = new bootstrap.Modal(document.getElementById('detailsModal'));
    const openPaths = new Set();
    let currentUsername = '';
    let adminUsername = '';
    let topDir = '';
    let userSettings = { localPathRoot: 'P:' };
    let globalFeatures = { filebot: true, handbrake: true };
    let slots = [];

    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const localPathRootInput = document.getElementById('local-path-root');

    saveSettingsBtn.addEventListener('click', () => {
        const root = localPathRootInput.value.trim();
        if (root) socket.emit('update-settings', { localPathRoot: root });
    });

    socket.on('settings-updated', (settings) => {
        userSettings = settings;
        localPathRootInput.value = userSettings.localPathRoot;
        alert('Settings saved.');
    });

    addSessionBtn.addEventListener('click', () => socket.emit('add-slot'));

    socket.on('init-state', (data) => {
        globalFeatures = data.features;
        adminUsername = data.adminUsername;
        topDir = data.topDir || '';
        userSettings = data.settings || { localPathRoot: 'P:' };
        localPathRootInput.value = userSettings.localPathRoot;
        renderSlots(data.slots);
    });

    socket.on('slot-added', (data) => renderSlots(data.slots));
    
    socket.on('user-info', (name) => { 
        currentUsername = name;
        document.getElementById('status').innerText = `Connected as ${name}`; 
    });

    socket.on('config-updated', (data) => {
        const slot = slots[data.index];
        if (slot) {
            slot.config = data.config;
            applySlotConfig(data.index, data.config);
        }
    });

    socket.on('output', (data) => {
        const slot = slots[data.index];
        if (slot && slot.term) {
            let cleanData = data.data;

            // Intercept Download Progress
            if (cleanData.includes('[DL_PROGRESS]')) {
                const match = cleanData.match(/\[DL_PROGRESS\]\s+(\d+)%/);
                if (match) {
                    const percent = match[1];
                    updateDownloadProgress(data.index, percent);
                }
                return; // Hide from console
            }

            // Intercept URL for name guessing
            if (cleanData.includes('[DL] URL:')) {
                const urlMatch = cleanData.match(/\[DL\] URL:\s+(.+)/);
                if (urlMatch) {
                    const fileName = urlMatch[1].split('/').pop().split('?')[0];
                    document.getElementById(`dl-name-${data.index}`).innerText = decodeURIComponent(fileName);
                    document.getElementById(`dl-progress-area-${data.index}`).style.setProperty('display', 'flex', 'important');
                }
            }

            // Reset progress on completion or skip
            if (cleanData.includes('[✓] Download complete') || cleanData.includes('[✗] Download failed') || cleanData.includes('[Skip]')) {
                setTimeout(() => {
                    document.getElementById(`dl-progress-area-${data.index}`).style.setProperty('display', 'none', 'important');
                }, 2000);
            }

            slot.term.write(cleanData);
            if (slot.isAtBottom) slot.term.scrollToBottom();

            setTimeout(() => checkFileBotPrompt(data.index), 50);
        }
    });

    function updateDownloadProgress(index, percent) {
        const bar = document.getElementById(`dl-bar-${index}`);
        const text = document.getElementById(`dl-percent-${index}`);
        const area = document.getElementById(`dl-progress-area-${index}`);
        if (bar) bar.style.width = percent + '%';
        if (text) text.innerText = percent + '%';
        if (area) area.style.setProperty('display', 'flex', 'important');
    }

    function checkFileBotPrompt(index) {
        const slot = slots[index];
        if (!slot || !slot.term) return;

        const term = slot.term;
        const buffer = term.buffer.active;
        let lastLines = [];

        for (let i = buffer.baseY + term.rows - 1; i >= Math.max(0, buffer.baseY); i--) {
            const line = buffer.getLine(i);
            if (line) lastLines.unshift(line.translateToString().trim());
        }

        const fullText = lastLines.join('\n');
        const promptArea = document.getElementById(`fb-prompt-area-${index}`);
        const select = document.getElementById(`fb-choices-${index}`);

        if (fullText.includes('Type? (S=Show, M=Movie, Skip=Enter):')) {
            if (select.dataset.type === 'mode') return;
            select.innerHTML = '<option value="">Select Mode...</option>' +
                '<option value="S\n">TV Show</option>' +
                '<option value="M\n">Movie</option>' +
                '<option value="\n">Skip</option>';
            select.dataset.type = 'mode';
            promptArea.style.setProperty('display', 'flex', 'important');
            return;
        }

        if (fullText.includes('Choice:')) {
            const lines = fullText.split('\n');
            const options = [];
            const optionRegex = /^\s*(\d+)\)\s+(.+)$/;

            lines.forEach(line => {
                const match = line.match(optionRegex);
                if (match) options.push({ val: match[1] + '\n', label: line.trim() });
            });

            if (options.length > 0) {
                if (select.dataset.type === 'choice' && select.options.length === options.length + 1) return;
                select.innerHTML = '<option value="">Select Match...</option>' +
                    options.map(o => `<option value="${o.val}">${o.label}</option>`).join('');
                select.dataset.type = 'choice';
                promptArea.style.setProperty('display', 'flex', 'important');
                return;
            }
        }

        if (promptArea.style.display === 'flex' && !fullText.includes('Choice:') && !fullText.includes('Type?')) {
            promptArea.style.setProperty('display', 'none', 'important');
            select.dataset.type = '';
        }
    }

    function submitFbChoice(index) {
        const select = document.getElementById(`fb-choices-${index}`);
        const val = select.value;
        if (!val) return;

        socket.emit('input', { index, input: val });
        document.getElementById(`fb-prompt-area-${index}`).style.setProperty('display', 'none', 'important');
        select.dataset.type = '';
        select.value = '';
    }

    socket.on('clear-terminal', (data) => {
        const slot = slots[data.index];
        if (slot && slot.term) { slot.term.clear(); slot.term.reset(); }
    });

    socket.on('process-exit', (data) => {
        const slot = slots[data.index];
        if (slot) {
            document.getElementById(`run-btn-${data.index}`).disabled = false;
            document.getElementById(`kill-btn-${data.index}`).disabled = true;
            document.getElementById(`slot-card-${data.index}`).classList.remove('running');
        }
    });

    function renderSlots(slotData) {
        // Cleanup existing terminals
        slots.forEach(s => { if (s.term) s.term.dispose(); });
        slots = [];
        slotsContainer.innerHTML = '';

        slotData.forEach((s, i) => {
            const slotEl = document.createElement('div');
            slotEl.className = `card p-4 slot-card ${s.isRunning ? 'running' : ''}`;
            slotEl.id = `slot-card-${i}`;
            slotEl.innerHTML = `
                <div class="session-header">
                    <h5 class="mb-0">Session ${i + 1}</h5>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-4"><label class="form-label">Mode</label>
                        <select id="type-${i}" class="form-select sync-config" data-slot="${i}"><option value="movie">Movie</option><option value="show">TV Show</option><option value="transcode-only">HandBrake Only</option><option value="filebot-only">FileBot Only</option></select>
                    </div>
                    <div class="col-md-4"><label class="form-label">Project</label><input type="text" id="project-${i}" class="form-control sync-config" data-slot="${i}" placeholder="CustomProject..."></div>
                    <div class="col-md-4"><label class="form-label">URL / Path</label><input type="text" id="url-${i}" class="form-control sync-config" data-slot="${i}" placeholder="http://..."></div>
                    <div class="col-md-3 mt-4"><div class="form-check form-switch"><input class="form-check-input sync-config" type="checkbox" id="useFilebot-${i}" data-slot="${i}"><label class="form-check-label">Use FileBot</label></div></div>
                    <div class="col-md-3 mt-4"><div class="form-check form-switch"><input class="form-check-input sync-config" type="checkbox" id="fbAutoPick-${i}" data-slot="${i}"><label class="form-check-label">FB Auto-pick</label></div></div>
                    <div class="col-md-3 mt-4"><div class="form-check form-switch"><input class="form-check-input sync-config" type="checkbox" id="useHandbrake-${i}" data-slot="${i}"><label class="form-check-label">Use HandBrake</label></div></div>
                    <div class="col-md-3 mt-4 d-flex gap-2">
                        <button id="run-btn-${i}" class="btn btn-primary flex-grow-1" onclick="runCommand(${i})">RUN</button>
                        <button id="kill-btn-${i}" class="btn btn-danger" onclick="killCommand(${i})" ${s.isRunning ? '' : 'disabled'}>KILL</button>
                        ${i > 0 ? `<button class="btn btn-outline-danger" onclick="removeSlot(${i})" title="Remove Session">Remove</button>` : ''}
                    </div>
                </div>
                <div class="terminal-wrapper">
                    <div id="fb-prompt-area-${i}" class="fb-prompt-floating">
                        <span class="small text-muted">FileBot:</span>
                        <select id="fb-choices-${i}" class="fb-dropdown" onchange="submitFbChoice(${i})">
                            <option value="">Select option...</option>
                        </select>
                    </div>
                    <div class="terminal-scroll-area"><div id="term-${i}" class="terminal-container"></div></div>
                    <div class="terminal-footer">
                        <div class="d-flex align-items-center gap-3 flex-grow-1">
                            <div id="dl-progress-area-${i}" class="d-flex align-items-center gap-2 flex-grow-1 me-3" style="display: none !important; min-width: 0;">
                                <span class="small text-info text-nowrap" id="dl-name-${i}" style="flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0;">Downloading...</span>
                                <div class="progress" style="height: 10px; background-color: #333; width: 100px; flex-shrink: 0;">
                                    <div id="dl-bar-${i}" class="progress-bar bg-info progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                                </div>
                                <span class="small text-info" id="dl-percent-${i}" style="flex-shrink: 0;">0%</span>
                            </div>
                        </div>
                        <a href="#" class="scroll-to-bottom" onclick="scrollToBottom(event, ${i})">↓ Go to bottom</a>
                    </div>
                </div>
            `;
            slotsContainer.appendChild(slotEl);

            const term = new Terminal({ theme: { background: '#000000', foreground: '#00ff00' }, convertEol: true, scrollback: 5000, fontSize: 13 });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById(`term-${i}`));
            fitAddon.fit();

            if (s.logs) term.write(s.logs);
            if (s.isRunning) document.getElementById(`run-btn-${i}`).disabled = true;

            const slotObj = { term, fitAddon, isAtBottom: true, config: s.config };
            slots.push(slotObj);

            term.onScroll(() => {
                const buffer = term.buffer.active;
                slotObj.isAtBottom = (buffer.viewportY + term.rows) >= buffer.baseY;
            });

            applySlotConfig(i, s.config);
            applyFeaturesToSlot(i);
            
            // Re-sync size after a moment
            setTimeout(() => {
                fitAddon.fit();
                socket.emit('resize', { index: i, cols: term.cols, rows: term.rows });
            }, 500);
        });

        document.querySelectorAll('.sync-config').forEach(el => {
            el.addEventListener('change', (e) => {
                const idx = parseInt(e.target.dataset.slot);
                socket.emit('update-config', { index: idx, config: getSlotConfig(idx) });
            });
        });

        addSessionBtn.disabled = slots.length >= 3;
    }

    function removeSlot(index) { socket.emit('remove-slot', index); }

    function runCommand(index) {
        const config = getSlotConfig(index);
        const slot = slots[index];
        config.cols = slot.term.cols;
        config.rows = slot.term.rows;
        socket.emit('run-command', { index, config });
        document.getElementById(`run-btn-${index}`).disabled = true;
        document.getElementById(`kill-btn-${index}`).disabled = false;
        document.getElementById(`slot-card-${index}`).classList.add('running');
    }

    function killCommand(index) { socket.emit('kill', index); }

    function scrollToBottom(e, index) {
        e.preventDefault();
        const slot = slots[index];
        if (slot) { slot.term.scrollToBottom(); slot.isAtBottom = true; }
    }

    function getSlotConfig(i) {
        return {
            type: document.getElementById(`type-${i}`).value,
            url: document.getElementById(`url-${i}`).value,
            project: document.getElementById(`project-${i}`).value,
            useFilebot: document.getElementById(`useFilebot-${i}`).checked,
            fbAutoPick: document.getElementById(`fbAutoPick-${i}`).checked,
            useHandbrake: document.getElementById(`useHandbrake-${i}`).checked
        };
    }

    function applySlotConfig(i, config) {
        if (!config) return;
        document.getElementById(`type-${i}`).value = config.type;
        document.getElementById(`url-${i}`).value = config.url;
        document.getElementById(`project-${i}`).value = config.project || '';
        document.getElementById(`useFilebot-${i}`).checked = config.useFilebot;
        document.getElementById(`fbAutoPick-${i}`).checked = config.fbAutoPick;
        document.getElementById(`useHandbrake-${i}`).checked = config.useHandbrake;
    }

    function applyFeaturesToSlot(i) {
        const fbEl = document.getElementById(`useFilebot-${i}`);
        const hbEl = document.getElementById(`useHandbrake-${i}`);
        fbEl.disabled = !globalFeatures.filebot;
        hbEl.disabled = !globalFeatures.handbrake;
    }

    // Tree Logic
    socket.on('tree-data', (data) => { renderTree(data.staging, document.getElementById('staging-tree'), 'staging', true); renderTree(data.outputs, document.getElementById('outputs-tree'), 'outputs', true); });
    
    function renderTree(data, container, treeId, isTopLevel = false, path = '') {
        if (isTopLevel) container.innerHTML = '';
        if (!data || data.length === 0) { if (isTopLevel) container.innerHTML = '<div class="text-muted small">Empty</div>'; return; }
        const ul = document.createElement('ul'); ul.className = 'tree-list active';
        data.forEach(item => {
            const currentPath = `${path}/${item.name}`;
            const li = document.createElement('li');
            li.className = 'tree-item ' + (item.isDirectory ? 'folder' : 'file');
            if (item.isDirectory && openPaths.has(`${treeId}:${currentPath}`)) li.classList.add('open');
            const span = document.createElement('span'); span.innerText = item.name; li.appendChild(span);
            if (item.isDirectory) {
                const nested = document.createElement('div');
                nested.className = openPaths.has(`${treeId}:${currentPath}`) ? 'active' : 'nested';
                li.appendChild(nested);
                li.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isOpen = this.classList.toggle('open');
                    const n = this.querySelector('div');
                    if (isOpen) { n.classList.replace('nested', 'active'); openPaths.add(`${treeId}:${currentPath}`); }
                    else { n.classList.replace('active', 'nested'); openPaths.delete(`${treeId}:${currentPath}`); }
                });
                renderTree(item.children, nested, treeId, false, currentPath);
            } else {
                li.addEventListener('click', function(e) {
                    e.stopPropagation();
                    detailsModal.show();
                    document.getElementById('detailsBody').innerHTML = '<div class="text-center py-4">Probing file...</div>';
                    socket.emit('get-file-details', { root: treeId, filePath: currentPath.substring(1) });
                });
            }
            ul.appendChild(li);
        });
        container.appendChild(ul);
    }

    socket.on('file-details', (data) => {
        const body = document.getElementById('detailsBody'); document.getElementById('detailsTitle').innerText = data.name;
        if (data.error) { body.innerHTML = `<div class="text-danger text-center">${data.error}</div>`; return; }

        const isAdmin = adminUsername && currentUsername === adminUsername;
        let displayPath = data.path; // e.g. "__STAGING__/project/file.mkv"
        let explorerLink = '';

        // Construct local path: (localpathmodifier)\(topdirectory)\relative_path
        let localModifier = userSettings.localPathRoot || 'P:';
        const winRelativePath = displayPath.replace(/\//g, '\\');
        const winTopDir = topDir.replace(/\//g, '\\');

        // Join parts and ensure single backslashes (except possibly after drive letter)
        let fullLocalPath = [localModifier, winTopDir, winRelativePath].join('\\').replace(/\\+/g, '\\');

        // Fix drive letter colon (P:\ instead of P\)
        if (/^[a-zA-Z]:\\/.test(fullLocalPath) === false && /^[a-zA-Z]:/.test(fullLocalPath)) {
            fullLocalPath = fullLocalPath.replace(/^([a-zA-Z]:)/, '$1\\');
        }

        const folderPath = fullLocalPath.substring(0, fullLocalPath.lastIndexOf('\\'));
        if (isAdmin) {
            explorerLink = 'file:///' + folderPath.replace(/\\/g, '/') + '/';
        }

        const rows = [['File Size', data.size],['Duration', data.duration],['Container', data.container],['Resolution', data.width ? `${data.width}x${data.height}` : 'N/A'],['Frame Rate', data.fps],['Audio Bitrate', data.audio_bitrate],['Channels', data.channels],['Sample Rate', data.sample_rate]];
        body.innerHTML = `
            ${data.thumbnail ? `<div class="mb-3" style="margin: -1rem -1rem 1rem -1rem; overflow: hidden; border-bottom: 1px solid #333;"><img src="data:image/jpeg;base64,${data.thumbnail}" style="width: 100%; display: block; object-fit: cover; max-height: 250px;"></div>` : ''}
            <div class="mb-3 border-bottom border-secondary pb-2">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <div class="detail-label">Local Folder Path</div>
                    <div>
                        <button class="icon-btn" id="copy-folder-btn" title="Select Folder Path"><svg><use xlink:href="#icon-copy"></use></svg></button>
                        ${isAdmin ? `<a href="${explorerLink}" class="icon-btn" title="Open Folder"><svg><use xlink:href="#icon-folder"></use></svg></a>` : ''}
                    </div>
                </div>
                <input type="text" id="folder-path-input" readonly class="form-control form-control-sm" style="background:#121212; border:1px solid #333; color:#8be9fd; font-family:monospace;" value="${folderPath}">
            </div>
            ${rows.map(r => `<div class="detail-row"><span class="detail-label">${r[0]}</span><span class="detail-value">${r[1] || 'N/A'}</span></div>`).join('')}
        `;
        document.getElementById('copy-folder-btn').onclick = () => {
            const input = document.getElementById('folder-path-input'); input.select(); input.setSelectionRange(0, 99999);
            try { document.execCommand('copy'); } catch (err) {}
        };
    });

    socket.on('connect', () => { statusBadge.innerText = 'Connected'; statusBadge.className = 'badge bg-success'; socket.emit('get-tree'); });
    socket.on('disconnect', () => { statusBadge.innerText = 'Disconnected'; statusBadge.className = 'badge bg-danger'; });
</script>
</body>
</html>

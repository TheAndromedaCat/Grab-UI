app-id: com.github.grab_ui
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: grab-ui-start
finish-args:
  - --share=network
  - --share=ipc
  - --filesystem=home
  - --device=all
  - --allow=multiarch
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: nodejs
    sources:
      - type: archive
        url: https://nodejs.org/dist/v20.11.1/node-v20.11.1-linux-x64.tar.xz
        sha256: 09d9482fd8f90c3710776b927a42a0487532d8478d1045a1f6a6f6911c471018
    cleanup:
      - /include
      - /share/doc
      - /share/man

  - name: grab-ui
    buildsystem: simple
    build-commands:
      - npm install
      - npm install -g pm2
      - install -d /app/bin
      - cp -r * /app/
      - ln -s /app/index.js /app/bin/grab-ui-server
      - |
        cat <<EOF > /app/bin/grab-ui-start
        #!/bin/bash
        # Ensure the persistent directory exists on the host
        GRAB_HOME="\$HOME/grab"
        mkdir -p "\$GRAB_HOME/__STAGING__" "\$GRAB_HOME/__OUTPUTS__"
        
        # Link them into the app directory if they don't exist
        [ ! -L "/app/__STAGING__" ] && ln -s "\$GRAB_HOME/__STAGING__" /app/__STAGING__
        [ ! -L "/app/__OUTPUTS__" ] && ln -s "\$GRAB_HOME/__OUTPUTS__" /app/__OUTPUTS__
        
        echo "🚀 Grab UI Server is now ACTIVE"
        echo "🌐 Access it at: http://localhost:2026"
        echo "------------------------------------------------"
        
        cd /app && pm2 start index.js --name "grab-ui" --no-daemon
        EOF
      - chmod +x /app/bin/grab-ui-start
    sources:
      - type: dir
        path: ..
